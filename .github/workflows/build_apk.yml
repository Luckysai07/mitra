name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons

      - name: Copy Named APK for Release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mitra-app.apk

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create/Update GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Mitra v1.0.1 — Latest Build"
          body: |
            ## 📱 Mitra — Digital Association Ledger (v1.0.1)

            **Latest stable APK build** with Multi-Year Tracking, Target Goal Persistence & Android Crash Fixes.

            ### How to Install on Android
            1. **Uninstall any previous version of Mitra** from your phone first.
            2. Download **`app-release.apk`** or **`mitra-app.apk`** below.
            3. Open your phone's **Files / Downloads** app and tap the file.
            4. If prompted with *"Install unknown apps"*, tap **Settings** and enable **"Allow from this source"**.
            5. If Google Play Protect warns about an unverified app, tap **"More details"** ➔ **"Install anyway"**.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/mitra-app.apk
          make_latest: true
          overwrite: true
          prerelease: false
